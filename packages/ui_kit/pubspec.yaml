name: ui_kit
description: "Shared widgets, theme and Indonesian localization for the watch and mobile apps."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=3.38.0"

dependencies:
  core:
    path: ../core
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.2
  vector_graphics: ^1.3.1

dev_dependencies:
  alchemist: ^0.14.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  vector_graphics_compiler: 1.3.6

flutter:
  generate: true
  # Brand assets shared by both apps. Sources (SVG) live in design/assets/.
  # The wordmark is a real vector, precompiled at build time (doc 18); the
  # logo is a raster image in the source SVG, so it ships as PNG.
  assets:
    - assets/brands/logo.png
    - path: assets/brands/wordmark.svg
      transformers:
        - package: vector_graphics_compiler
  # Bundled font (A.1: never a network font). Referenced as
  # fontFamily 'Inter', package 'ui_kit'. License: fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
