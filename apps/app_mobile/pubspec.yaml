name: app_mobile
description: "Task assignment app for Android phones and Android/iOS tablets."
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  app_shell:
    path: ../../packages/app_shell
  camera_scanner:
    path: ../../packages/camera_scanner
  core:
    path: ../../packages/core
  feature_auth:
    path: ../../packages/feature_auth
  feature_availability:
    path: ../../packages/feature_availability
  feature_task:
    path: ../../packages/feature_task
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.3
  lucide_icons_flutter: ^4.0.2
  ui_kit:
    path: ../../packages/ui_kit

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  intl: ^0.20.3
  mocktail: ^1.0.5

flutter:
  assets:
    - shorebird.yaml
    # Phone/tablet only (the watch shows no illustration, A.3). Rendered from
    # design/assets/illustrations/*.svg; loaded by ui_kit's TechnicianIllustration.
    - assets/illustrations/
  uses-material-design: true
